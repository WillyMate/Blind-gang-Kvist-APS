services:
  api:
    build: ./server
    environment:
      DB: "Data Source=/data/app.db"
      Jwt__Key: ${JWT_KEY}
      Seed__AdminUser: ${ADMIN_USER}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
    volumes:
      - api-data:/data
    restart: unless-stopped

  web:
    build: ./clinet
    environment:
      API_URL: "http://api:8080"
    ports:
      - "8000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data: